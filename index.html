<style>

    --ground: #090c11;
    --ground-2: #0d1219;
    --panel: #12171f;
    --panel-2: #161d27;

  body {

      radial-gradient(1200px 700px at 50% -10%, #12202b 0%, var(--ground) 60%);

  #app {

  /* ---------- header ---------- */

  /* ---------- controls ---------- */

  input[type="range"] {

<div id="app">
  <header>

      <span class="eyebrow">Hypervelocity Impact · 2D Sandbox</span>

      <div class="stat temp"><div class="k">最高温度</div><div class="v"><span id="r-temp">20</span><span class="u">°C*</span></div></div>
      <div class="stat"><div class="k">スロー</div><div class="v"><span id="r-slow">0.20</span><span class="u">x</span></div></div>
      <div class="stat"><div class="k">破片</div><div class="v" id="r-frag">0</div></div>

    <canvas id="c" width="960" height="600"></canvas>

      <div class="row"><label for="s-speed">初速</label><span class="val" id="v-speed">1800 u/s</span></div>

    </div>
    <div class="ctl">
      <div class="row"><label for="s-str">ターゲット強度</label><span class="val" id="v-str">50</span></div>
      <input id="s-str" type="range" min="0" max="100" value="46" />
    </div>
    <div class="ctl">
      <div class="row"><label for="s-slow">スロー再生</label><span class="val" id="v-slow">0.20x</span></div>
      <input id="s-slow" type="range" min="2" max="100" value="20" />

      <button id="b-play" class="primary" type="button">⏸ 一時停止</button>

<script>
(() => {
  "use strict";

  const W = 960, H = 600, FLOOR = 560;
  const canvas = document.getElementById("c");
  const ctx = canvas.getContext("2d");

  // ---- tunables ----
  const DT = 1 / 480;         // fixed physics timestep (s)
  const BASE_STEPS = 8;       // substeps per frame at 1.0x  => 8*DT = 1/60 s
  const ITER = 4;             // constraint iterations
  const DAMP = 0.999;
  const G = 820;              // gravity (u/s^2)
  const MAXSTEP = 12;         // per-substep displacement clamp (u)
  const SPACING = 9;

  const R_PLATE = 4, R_PROJ = 5;
  const IW_PLATE = 1, IW_PROJ = 1 / 6;

  // ---- particle arrays (allocated after build) ----
  let N = 0;
  let x, y, ox, oy, iw, rad, kind, heat; // kind: 0 plate, 1 projectile
  // ---- bonds (parallel arrays) ----
  let bi, bj, brest, balive, bproj, bCount;

  // ---- collision grid ----
  const CELL = 11;
  const GW = Math.ceil(W / CELL), GH = Math.ceil(H / CELL);
  const head = new Int32Array(GW * GH);
  let next;

  // ---- sparks ----
  const sparks = []; // {x,y,vx,vy,life}

  // ---- runtime state ----
  let running = true;
  let acc = 0;
  let launchSpeed = 1800;   // u/s, set from slider on build
  let breakStrain = 0.2;    // from strength slider (live)
  let slowmo = 0.20;
  let brokenCount = 0;
  let maxHeatEver = 0;

  // ---------- build scene ----------
  function build() {
    const px = [], py = [], pkind = [];
    // target plate: grid, bottom row pinned to ground
    const cols = 24, rows = 30;
    const plateW = (cols - 1) * SPACING;
    const plateH = (rows - 1) * SPACING;
    const left = 640 - plateW / 2;
    const bottom = FLOOR - 6;
    const top = bottom - plateH;
    const idx = (r, c) => plateBase + r * cols + c;
    const plateBase = 0;
    for (let r = 0; r < rows; r++) {
      for (let c = 0; c < cols; c++) {
        px.push(left + c * SPACING);
        py.push(top + r * SPACING);
        pkind.push(0);
      }
    }
    // projectile: filled disk of heavy particles on the left, aimed at plate center
    const projStart = px.length;
    const cx = 120, cy = (top + bottom) / 2, discR = 24;
    for (let gy = -discR; gy <= discR; gy += SPACING) {
      for (let gx = -discR; gx <= discR; gx += SPACING) {
        if (gx * gx + gy * gy <= discR * discR) {
          px.push(cx + gx);
          py.push(cy + gy);
          pkind.push(1);
        }
      }
    }

    N = px.length;
    x = new Float32Array(px);
    y = new Float32Array(py);
    ox = new Float32Array(N);
    oy = new Float32Array(N);
    iw = new Float32Array(N);
    rad = new Float32Array(N);
    kind = new Uint8Array(pkind);
    heat = new Float32Array(N);
    next = new Int32Array(N);

    for (let i = 0; i < N; i++) {
      if (kind[i] === 0) {
        rad[i] = R_PLATE;
        // pin bottom row
        const isBottom = py[i] >= bottom - 0.5;
        iw[i] = isBottom ? 0 : IW_PLATE;
      } else {
        rad[i] = R_PROJ;
        iw[i] = IW_PROJ;
      }
      ox[i] = x[i];
      oy[i] = y[i];
    }

    // launch projectile: encode velocity via previous position
    launchSpeed = speedFromSlider(+els.speed.value);
    for (let i = 0; i < N; i++) {
      if (kind[i] === 1) ox[i] = x[i] - launchSpeed * DT;
    }

    // ---- bonds ----
    const _bi = [], _bj = [], _rest = [], _proj = [];
    const addBond = (a, b, proj) => {
      const dx = x[a] - x[b], dy = y[a] - y[b];
      _bi.push(a); _bj.push(b);
      _rest.push(Math.hypot(dx, dy));
      _proj.push(proj ? 1 : 0);
    };
    // plate lattice: right, down, and two diagonals (shear rigidity)
    for (let r = 0; r < rows; r++) {
      for (let c = 0; c < cols; c++) {
        const a = idx(r, c);
        if (c + 1 < cols) addBond(a, idx(r, c + 1), false);
        if (r + 1 < rows) addBond(a, idx(r + 1, c), false);
        if (r + 1 < rows && c + 1 < cols) addBond(a, idx(r + 1, c + 1), false);
        if (r + 1 < rows && c - 1 >= 0) addBond(a, idx(r + 1, c - 1), false);
      }
    }
    // projectile: bond every near pair (rigid slug, very hard to break)
    const link = SPACING * 1.6;
    for (let a = projStart; a < N; a++) {
      for (let b = a + 1; b < N; b++) {
        const d = Math.hypot(x[a] - x[b], y[a] - y[b]);
        if (d <= link) addBond(a, b, true);
      }
    }

    bCount = _bi.length;
    bi = new Int32Array(_bi);
    bj = new Int32Array(_bj);
    brest = new Float32Array(_rest);
    bproj = new Uint8Array(_proj);
    balive = new Uint8Array(bCount).fill(1);

    sparks.length = 0;
    brokenCount = 0;
    maxHeatEver = 0;
    acc = 0;
  }

  // ---------- physics substep ----------
  function substep(dt) {
    const g = G * dt * dt;

    // integrate (Verlet)
    for (let i = 0; i < N; i++) {
      if (iw[i] === 0) continue;
      let vx = (x[i] - ox[i]) * DAMP;
      let vy = (y[i] - oy[i]) * DAMP;
      if (vx > MAXSTEP) vx = MAXSTEP; else if (vx < -MAXSTEP) vx = -MAXSTEP;
      if (vy > MAXSTEP) vy = MAXSTEP; else if (vy < -MAXSTEP) vy = -MAXSTEP;
      ox[i] = x[i]; oy[i] = y[i];
      x[i] += vx;
      y[i] += vy + g;
      heat[i] *= 0.9965; // cool
    }

    // distance constraints
    for (let k = 0; k < ITER; k++) {
      for (let b = 0; b < bCount; b++) {
        if (!balive[b]) continue;
        const a = bi[b], c = bj[b];
        let dx = x[c] - x[a], dy = y[c] - y[a];
        let d = Math.sqrt(dx * dx + dy * dy);
        if (d < 1e-6) continue;
        const wsum = iw[a] + iw[c];
        if (wsum === 0) continue;
        const diff = (d - brest[b]) / d;
        const cx = dx * diff, cy = dy * diff;
        const wa = iw[a] / wsum, wc = iw[c] / wsum;
        x[a] += cx * wa; y[a] += cy * wa;
        x[c] -= cx * wc; y[c] -= cy * wc;
      }
    }

    // break check (after solve, on final positions)
    for (let b = 0; b < bCount; b++) {
      if (!balive[b]) continue;
      const a = bi[b], c = bj[b];
      const dx = x[c] - x[a], dy = y[c] - y[a];
      const d = Math.sqrt(dx * dx + dy * dy);
      const strain = (d - brest[b]) / brest[b];
      const thresh = bproj[b] ? 4.0 : breakStrain;
      if (strain > thresh) {
        balive[b] = 0;
        brokenCount++;
        const q = Math.min(1, (strain - thresh) * 2 + 0.35);
        heat[a] = Math.min(1, heat[a] + q * 0.5);
        heat[c] = Math.min(1, heat[c] + q * 0.5);
        spawnSpark((x[a] + x[c]) / 2, (y[a] + y[c]) / 2, a, c);
      }
    }

    // particle collisions via uniform grid
    head.fill(-1);
    for (let i = 0; i < N; i++) {
      let cxg = (x[i] / CELL) | 0, cyg = (y[i] / CELL) | 0;
      if (cxg < 0) cxg = 0; else if (cxg >= GW) cxg = GW - 1;
      if (cyg < 0) cyg = 0; else if (cyg >= GH) cyg = GH - 1;
      const cell = cyg * GW + cxg;
      next[i] = head[cell];
      head[cell] = i;
    }
    for (let i = 0; i < N; i++) {
      let cxg = (x[i] / CELL) | 0, cyg = (y[i] / CELL) | 0;
      if (cxg < 0) cxg = 0; else if (cxg >= GW) cxg = GW - 1;
      if (cyg < 0) cyg = 0; else if (cyg >= GH) cyg = GH - 1;
      for (let oyy = -1; oyy <= 1; oyy++) {
        const ny = cyg + oyy;
        if (ny < 0 || ny >= GH) continue;
        for (let oxx = -1; oxx <= 1; oxx++) {
          const nx = cxg + oxx;
          if (nx < 0 || nx >= GW) continue;
          let j = head[ny * GW + nx];
          while (j !== -1) {
            if (j > i) collide(i, j, dt);
            j = next[j];
          }
        }
      }
    }

    // boundaries: floor + side walls
    for (let i = 0; i < N; i++) {
      if (iw[i] === 0) continue;
      const r = rad[i];
      if (y[i] > FLOOR - r) {
        y[i] = FLOOR - r;
        const vy = y[i] - oy[i];
        oy[i] = y[i] + vy * 0.3;        // 30% bounce
        const vx = x[i] - ox[i];
        ox[i] = x[i] - vx * 0.6;        // floor friction
      }
      if (x[i] < r) { x[i] = r; ox[i] = x[i] + (x[i] - ox[i]) * 0.4; }
      else if (x[i] > W - r) { x[i] = W - r; ox[i] = x[i] + (x[i] - ox[i]) * 0.4; }
    }

    updateSparks(dt);
  }

  function collide(i, j, dt) {
    if (kind[i] === 1 && kind[j] === 1) return; // skip projectile self-collision
    const minD = rad[i] + rad[j];
    let dx = x[j] - x[i], dy = y[j] - y[i];
    let d2 = dx * dx + dy * dy;
    if (d2 >= minD * minD || d2 < 1e-9) return;
    const d = Math.sqrt(d2);
    const nx = dx / d, ny = dy / d;
    const overlap = minD - d;
    const wsum = iw[i] + iw[j];
    if (wsum === 0) return;
    const corr = overlap / wsum;
    x[i] -= nx * corr * iw[i]; y[i] -= ny * corr * iw[i];
    x[j] += nx * corr * iw[j]; y[j] += ny * corr * iw[j];

    // frictional heating from approach speed
    const rvx = (x[i] - ox[i]) - (x[j] - ox[j]);
    const rvy = (y[i] - oy[i]) - (y[j] - oy[j]);
    const approach = (rvx * nx + rvy * ny) / dt; // >0 => closing
    if (approach > 300) {
      const q = Math.min(0.5, (approach - 300) / 4000);
      heat[i] = Math.min(1, heat[i] + q);
      heat[j] = Math.min(1, heat[j] + q);
    }
  }

  // ---------- sparks ----------
  function spawnSpark(sx, sy, a, c) {
    if (sparks.length > 380) return;
    const vax = (x[a] - ox[a]) + (x[c] - ox[c]);
    const vay = (y[a] - oy[a]) + (y[c] - oy[c]);
    const n = 1 + (Math.random() * 2 | 0);
    for (let s = 0; s < n; s++) {
      sparks.push({
        x: sx, y: sy,
        vx: vax * 30 + (Math.random() - 0.5) * 260,
        vy: vay * 30 + (Math.random() - 0.5) * 260 - 40,
        life: 0.35 + Math.random() * 0.4,
      });
    }
  }
  function updateSparks(dt) {
    for (let i = sparks.length - 1; i >= 0; i--) {
      const p = sparks[i];
      p.life -= dt;
      if (p.life <= 0) { sparks.splice(i, 1); continue; }
      p.vy += G * dt;
      p.x += p.vx * dt;
      p.y += p.vy * dt;
      if (p.y > FLOOR) { p.y = FLOOR; p.vy *= -0.3; p.vx *= 0.5; }
    }
  }

  // ---------- color ----------
  const RAMP = [
    [0.00, [150, 40, 24]],
    [0.35, [236, 88, 20]],
    [0.60, [255, 168, 46]],
    [0.80, [255, 225, 120]],
    [1.00, [255, 255, 245]],
  ];
  function heatRamp(h) {
    for (let i = 1; i < RAMP.length; i++) {
      if (h <= RAMP[i][0]) {
        const [p0, c0] = RAMP[i - 1], [p1, c1] = RAMP[i];
        const t = (h - p0) / (p1 - p0);
        return [
          c0[0] + (c1[0] - c0[0]) * t,
          c0[1] + (c1[1] - c0[1]) * t,
          c0[2] + (c1[2] - c0[2]) * t,
        ];
      }
    }
    return RAMP[RAMP.length - 1][1];
  }
  const COLD_PLATE = [122, 134, 152];
  const COLD_PROJ = [150, 182, 216];
  function colorFor(i) {
    const h = heat[i];
    const cold = kind[i] ? COLD_PROJ : COLD_PLATE;
    if (h <= 0.03) return cold;
    const w = heatRamp(Math.min(1, h));
    const m = Math.min(1, h / 0.22);
    return [
      cold[0] + (w[0] - cold[0]) * m,
      cold[1] + (w[1] - cold[1]) * m,
      cold[2] + (w[2] - cold[2]) * m,
    ];
  }

  // ---------- render ----------
  function render() {
    // background
    ctx.fillStyle = "#0b0f15";
    ctx.fillRect(0, 0, W, H);
    // faint measurement grid
    ctx.strokeStyle = "#141b24";
    ctx.lineWidth = 1;
    ctx.beginPath();
    for (let gx = 0; gx <= W; gx += 48) { ctx.moveTo(gx, 0); ctx.lineTo(gx, FLOOR); }
    for (let gy = 0; gy <= FLOOR; gy += 48) { ctx.moveTo(0, gy); ctx.lineTo(W, gy); }
    ctx.stroke();
    // floor
    const fg = ctx.createLinearGradient(0, FLOOR, 0, H);
    fg.addColorStop(0, "#1b2531");
    fg.addColorStop(1, "#0c1118");
    ctx.fillStyle = fg;
    ctx.fillRect(0, FLOOR, W, H - FLOOR);
    ctx.strokeStyle = "#2b6f77";
    ctx.globalAlpha = 0.5;
    ctx.beginPath(); ctx.moveTo(0, FLOOR + 0.5); ctx.lineTo(W, FLOOR + 0.5); ctx.stroke();
    ctx.globalAlpha = 1;

    // particles
    let maxH = 0;
    for (let i = 0; i < N; i++) {
      const c = colorFor(i);
      if (heat[i] > maxH) maxH = heat[i];
      ctx.fillStyle = "rgb(" + (c[0] | 0) + "," + (c[1] | 0) + "," + (c[2] | 0) + ")";
      ctx.beginPath();
      ctx.arc(x[i], y[i], rad[i], 0, 6.2832);
      ctx.fill();
    }

    // glow pass (additive)
    ctx.globalCompositeOperation = "lighter";
    for (let i = 0; i < N; i++) {
      const h = heat[i];
      if (h < 0.32) continue;
      const w = heatRamp(Math.min(1, h));
      ctx.fillStyle = "rgba(" + (w[0] | 0) + "," + (w[1] | 0) + "," + (w[2] | 0) + "," + (h * 0.34).toFixed(3) + ")";
      ctx.beginPath();
      ctx.arc(x[i], y[i], rad[i] * 2.7, 0, 6.2832);
      ctx.fill();
    }
    // sparks (additive)
    for (let i = 0; i < sparks.length; i++) {
      const p = sparks[i];
      const a = Math.max(0, Math.min(1, p.life * 1.6));
      ctx.fillStyle = "rgba(255," + (170 + a * 80 | 0) + ",90," + a.toFixed(3) + ")";
      ctx.beginPath();
      ctx.arc(p.x, p.y, 1.6 + a * 1.4, 0, 6.2832);
      ctx.fill();
    }
    ctx.globalCompositeOperation = "source-over";

    if (maxH > maxHeatEver) maxHeatEver = maxH;
    updateReadouts();
  }

  // ---------- readouts / UI ----------
  const els = {
    speed: document.getElementById("s-speed"),
    str: document.getElementById("s-str"),
    slow: document.getElementById("s-slow"),
    vSpeed: document.getElementById("v-speed"),
    vStr: document.getElementById("v-str"),
    vSlow: document.getElementById("v-slow"),
    rSpeed: document.getElementById("r-speed"),
    rTemp: document.getElementById("r-temp"),
    rSlow: document.getElementById("r-slow"),
    rFrag: document.getElementById("r-frag"),
    play: document.getElementById("b-play"),
    reset: document.getElementById("b-reset"),
    status: document.getElementById("status"),
  };

  function speedFromSlider(v) { return Math.round(200 + (v - 10) / 90 * 2300); } // 200..2500 u/s
  function strainFromSlider(v) { return 0.35 - v / 100 * 0.30; } // strong => small break? invert below
  // NOTE: higher strength => harder to break => LARGER allowable strain
  function breakFromStrength(v) { return 0.05 + v / 100 * 0.30; } // 0.05 .. 0.35

  function syncControls() {
    launchSpeed = speedFromSlider(+els.speed.value);
    breakStrain = breakFromStrength(+els.str.value);
    slowmo = (+els.slow.value) / 100;
    els.vSpeed.textContent = launchSpeed + " u/s";
    els.vStr.textContent = els.str.value;
    els.vSlow.textContent = slowmo.toFixed(2) + "x";
  }

  function updateReadouts() {
    els.rSpeed.textContent = launchSpeed;
    els.rTemp.textContent = Math.round(20 + maxHeatEver * 2980);
    els.rSlow.textContent = slowmo.toFixed(2);
    els.rFrag.textContent = brokenCount;
  }

  function setRunning(v) {
    running = v;
    els.play.textContent = v ? "⏸ 一時停止" : "▶ 再開";
    els.status.textContent = v ? "▶ RUNNING" : "❚❚ PAUSED";
    els.status.classList.toggle("paused", !v);
  }

  els.speed.addEventListener("input", syncControls);
  els.str.addEventListener("input", syncControls);
  els.slow.addEventListener("input", syncControls);
  els.play.addEventListener("click", () => setRunning(!running));
  els.reset.addEventListener("click", () => { syncControls(); build(); setRunning(true); });

  window.addEventListener("keydown", (e) => {
    if (e.code === "Space") { e.preventDefault(); setRunning(!running); }
    else if (e.key === "r" || e.key === "R") { syncControls(); build(); setRunning(true); }
    else if (e.key === ".") { if (!running) for (let s = 0; s < 4; s++) substep(DT); }
  });

  // ---------- main loop ----------
  function frame() {
    if (running) {
      acc += slowmo * BASE_STEPS;
      let steps = acc | 0;
      acc -= steps;
      if (steps > 48) steps = 48;
      for (let s = 0; s < steps; s++) substep(DT);
    }
    render();
    requestAnimationFrame(frame);
  }

  // boot
  syncControls();
  build();
  if (window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches) {
    setRunning(false);
  }
  requestAnimationFrame(frame);
})();
</script>
